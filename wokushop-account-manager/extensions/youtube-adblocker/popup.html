<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin: 0;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .subtitle {
            font-size: 12px;
            opacity: 0.8;
        }
        .status {
            background: rgba(255,255,255,0.1);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            text-align: center;
        }
        .status-active {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid rgba(76, 175, 80, 0.3);
        }
        .status-icon {
            font-size: 20px;
            margin-bottom: 5px;
        }
        .stats {
            display: flex;
            justify-content: space-between;
            margin-top: 15px;
        }
        .stat {
            text-align: center;
            flex: 1;
        }
        .stat-number {
            font-size: 18px;
            font-weight: bold;
            color: #4CAF50;
        }
        .stat-label {
            font-size: 11px;
            opacity: 0.7;
            margin-top: 2px;
        }
        .footer {
            text-align: center;
            font-size: 10px;
            opacity: 0.6;
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">🛡️ WokuShop</div>
        <div class="subtitle">YouTube AdBlocker</div>
    </div>
    
    <div class="status status-active">
        <div class="status-icon">✅</div>
        <div><strong>Chế độ lọc: Hoàn toàn</strong></div>
        <div style="font-size: 12px; margin-top: 5px;">Đang chặn tất cả quảng cáo YouTube</div>
    </div>
    
    <div class="stats">
        <div class="stat">
            <div class="stat-number" id="blocked-count">∞</div>
            <div class="stat-label">Quảng cáo đã chặn</div>
        </div>
        <div class="stat">
            <div class="stat-number">100%</div>
            <div class="stat-label">Hiệu quả</div>
        </div>
    </div>
    
    <div class="footer">
        Được tối ưu hóa cho WokuShop Account Manager
    </div>
</body>
</html>
