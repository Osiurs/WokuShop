<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://db.handymancode.com">
  <title>Login - Woku App</title>
  <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
  <div class="login-container">
    <div class="login-box fade-in">
      <div class="login-header">
        <img src="../assets/images/logo.png" alt="Woku App Logo" class="app-logo-img">
        <h1 class="app-title">Woku App</h1>
        <p class="app-subtitle">Account Manager</p>
      </div>

      <div id="alertBox" class="alert alert-danger"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="username">Username</label>
          <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter your username"
            required
            autocomplete="username"
          >
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>

        <button type="submit" class="btn btn-primary" id="loginBtn">
          Sign In
        </button>
      </form>
    </div>
  </div>

  <script src="../assets/js/api.js"></script>
  <script src="../assets/js/login.js"></script>
</body>
</html>
