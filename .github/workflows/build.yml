name: Build Woku App

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: wokushop-account-manager/package-lock.json
      
      - name: Install dependencies
        working-directory: wokushop-account-manager
        run: npm ci
      
      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        working-directory: wokushop-account-manager
        run: npm run build:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        working-directory: wokushop-account-manager
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgconf-2-4 libnss3 libxtst6 libxss1 libasound2
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: wokushop-account-manager
        run: npm run build:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload macOS artifacts
        if: matrix.os == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: woku-app-macos
          path: |
            wokushop-account-manager/dist/*.dmg
            wokushop-account-manager/dist/*.zip
          retention-days: 30

      - name: Upload Windows artifacts
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: woku-app-windows
          path: |
            wokushop-account-manager/dist/*.exe
          retention-days: 30

      - name: Upload Linux artifacts
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: woku-app-linux
          path: |
            wokushop-account-manager/dist/*.AppImage
            wokushop-account-manager/dist/*.deb
          retention-days: 30

