name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: wokushop-account-manager/package-lock.json
      
      - name: Install dependencies
        working-directory: wokushop-account-manager
        run: npm ci
      
      - name: Build for macOS
        if: matrix.os == 'macos-latest'
        working-directory: wokushop-account-manager
        run: npm run build:mac
      
      - name: Build for Windows
        if: matrix.os == 'windows-latest'
        working-directory: wokushop-account-manager
        run: npm run build:win
      
      - name: Build for Linux
        if: matrix.os == 'ubuntu-latest'
        working-directory: wokushop-account-manager
        run: npm run build:linux

      - name: Upload Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts-${{ matrix.os }}
          path: |
            wokushop-account-manager/dist/*.dmg
            wokushop-account-manager/dist/*.zip
            wokushop-account-manager/dist/*.exe
            wokushop-account-manager/dist/*.AppImage
            wokushop-account-manager/dist/*.deb
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: List downloaded files
        run: find artifacts -type f

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
