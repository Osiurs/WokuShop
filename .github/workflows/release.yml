name: Release (Win/Mac/Linux)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-win:
    name: Windows NSIS (x64)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: wokushop-account-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'wokushop-account-manager/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish Windows (x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish always

  build-mac:
    name: macOS DMG/ZIP (x64, arm64)
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    defaults:
      run:
        working-directory: wokushop-account-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'wokushop-account-manager/package-lock.json'

      - name: Install dependencies
        run: npm ci

      # Unsigned build for macOS (suitable for distributing files). For auto-update on macOS, configure code signing & notarization.
      - name: Build & Publish macOS (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO: 'false'
        run: npx electron-builder --mac dmg zip --${{ matrix.arch }} --publish always

  # Optional: macOS Universal build (combine x64 + arm64). Enable if you want a single universal app.
  build-mac-universal:
    if: ${{ false }}
    name: macOS Universal (optional)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: wokushop-account-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'wokushop-account-manager/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish macOS Universal
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO: 'false'
        run: npx electron-builder --mac dmg zip --universal --publish always

  build-linux:
    name: Linux AppImage/deb/rpm (x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wokushop-account-manager
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system deps for rpm
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm xz-utils

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'wokushop-account-manager/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build & Publish Linux (x64)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux AppImage deb rpm --x64 --publish always

