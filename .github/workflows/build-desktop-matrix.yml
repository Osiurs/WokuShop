name: Build Desktop (mac+linux multi-arch)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: tách rõ x64 vs arm64
          - name: macOS x64
            runs-on: macos-15      # Intel
            oskey: mac
            arch: x64
          - name: macOS arm64
            runs-on: macos-latest  # Apple Silicon
            oskey: mac
            arch: arm64

          # Linux
          - name: Linux x64
            runs-on: ubuntu-latest
            oskey: linux
            arch: x64
          - name: Linux arm64
            runs-on: ubuntu-latest
            oskey: linux
            arch: arm64
            cross: true

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            wokushop-account-manager/package-lock.json
            package-lock.json

      # Auto-detect app directory (fallback to root if subfolder not found)
      - name: Detect app directory
        id: detect
        shell: bash
        run: |
          set -e
          APP_DIR="wokushop-account-manager"
          if [ ! -d "$APP_DIR" ] || [ ! -f "$APP_DIR/package.json" ]; then
            echo "⚠️ Subfolder '$APP_DIR' not found or missing package.json. Falling back to repo root."
            APP_DIR="."
          fi
          echo "App directory = $APP_DIR"
          echo "APP_DIR=$APP_DIR" >> $GITHUB_ENV

      # In nhanh cấu trúc và xác nhận file có mặt tại đúng chỗ
      - name: Inspect repo layout
        shell: bash
        run: |
          echo "PWD=$(pwd)"
          ls -la
          echo "---- tree level 2 ----"
          if command -v apt-get >/dev/null 2>&1; then
            sudo apt-get update >/dev/null 2>&1 || true
            (command -v tree >/dev/null || sudo apt-get install -y tree) || true
          fi
          tree -L 2 || true
          echo "---- show app package.json ($APP_DIR) ----"
          cat "$APP_DIR/package.json" || true

      - name: Install app deps (safe)
        working-directory: ${{ env.APP_DIR }}
        shell: bash
        run: |
          node -v
          npm -v
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install --no-audit --no-fund
          fi

      - name: Rebuild native deps for Electron
        working-directory: ${{ env.APP_DIR }}
        run: npx electron-builder install-app-deps || true

      - name: Linux tooling
        if: ${{ matrix.oskey == 'linux' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg rpm libx11-dev libxkbfile-dev libudev-dev xz-utils

      - name: Enable QEMU (for cross-arch)
        if: ${{ matrix.cross == true }}
        uses: docker/setup-qemu-action@v3

      - name: Build installers (verbose)
        working-directory: ${{ env.APP_DIR }}
        env:
          USE_HARD_LINKS: "false"
          ELECTRON_BUILDER_DOCKER: ${{ matrix.cross == true && 'true' || 'false' }}
        shell: bash
        run: |
          set -e
          echo "RUNNER_OS=$RUNNER_OS ARCH=${{ matrix.arch }} OSKEY=${{ matrix.oskey }}"
          npx electron-builder --version || true
          if [[ "${{ matrix.oskey }}" == "mac" ]]; then
            npx electron-builder --mac dmg zip --arch=${{ matrix.arch }} --publish=never --verbose
          else
            if [[ "${{ matrix.arch }}" == "arm64" ]]; then
              npx electron-builder --linux AppImage deb rpm --arm64 --publish=never --verbose
            else
              npx electron-builder --linux AppImage deb rpm --x64  --publish=never --verbose
            fi
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: WokuShop-${{ matrix.oskey }}-${{ matrix.arch }}
          path: ${{ env.APP_DIR }}/dist/**
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: ./artifacts/**/*
          draft: false
          prerelease: false
